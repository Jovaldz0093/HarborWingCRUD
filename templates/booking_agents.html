
{% extends "base.html" %}

{% block content %}

<h2>Booking Agent Management</h2>

<h3>Add Booking Agent</h3>

<form action="/add_booking_agent" method="POST">
    <label>Agent Name:</label>
    <input
        type="text"
        name="agent_name"
        maxlength="100"
        required
    >
    <br><br>

    <label>Details:</label>
    <textarea name="details"></textarea>
    <br><br>

    <button type="submit">Add Agent</button>
</form>

<hr>

<h3>Booking Agent List</h3>

<table border="1" cellpadding="8">
    <tr>
        <th>Agent ID</th>
        <th>Agent Name</th>
        <th>Details</th>
        <th>Action</th>
    </tr>

    {% for agent in agents %}
    <tr>
        <td>{{ agent.agent_id }}</td>
        <td>{{ agent.agent_name }}</td>
        <td>{{ agent.details or "" }}</td>
        <td>
            <a href="{{ url_for('edit_booking_agent', agent_id=agent.agent_id) }}">
                Edit
            </a>

            <form
                action="{{ url_for('delete_booking_agent', agent_id=agent.agent_id) }}"
                method="POST"
                style="display:inline;"
                onsubmit="return confirm('Delete this booking agent?');"
            >
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
