
{% extends "base.html" %}

{% block content %}

<h2>Edit Flight {{ flight.flight_number }}</h2>

<form method="POST">
    <label>Airline Code:</label>
    <input
        type="text"
        name="airline_code"
        value="{{ flight.airline_code }}"
        required
    >
    <br><br>

    <label>Aircraft Code:</label>
    <input
        type="text"
        name="aircraft_code"
        value="{{ flight.aircraft_code }}"
        required
    >
    <br><br>

    <label>Origin Airport:</label>
    <input
        type="text"
        name="origin"
        value="{{ flight.origin }}"
        required
    >
    <br><br>

    <label>Destination Airport:</label>
    <input
        type="text"
        name="destination"
        value="{{ flight.destination }}"
        required
    >
    <br><br>

    <label>Scheduled Departure:</label>
    <input
        type="datetime-local"
        name="scheduled_departure"
        value="{{ flight.scheduled_departure.strftime('%Y-%m-%dT%H:%M') }}"
        required
    >
    <br><br>

    <label>Scheduled Arrival:</label>
    <input
        type="datetime-local"
        name="scheduled_arrival"
        value="{{ flight.scheduled_arrival.strftime('%Y-%m-%dT%H:%M') }}"
        required
    >
    <br><br>

    <button type="submit">Save Changes</button>
</form>

<br>

<a href="{{ url_for('flight_schedules') }}">Back to Flight Schedules</a>

{% endblock %}
