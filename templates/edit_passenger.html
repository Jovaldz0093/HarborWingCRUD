
{% extends "base.html" %}

{% block content %}

<h2>Edit Passenger</h2>

<form method="POST">
    <label>First Name:</label>
    <input type="text" name="first_name" value="{{ passenger[1] }}" required>
    <br><br>

    <label>Last Name:</label>
    <input type="text" name="last_name" value="{{ passenger[2] }}" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ passenger[3] or '' }}">
    <br><br>

    <label>Phone:</label>
    <input type="text" name="phone" value="{{ passenger[4] or '' }}">
    <br><br>

    <button type="submit">Save Changes</button>
</form>

<br>

<a href="{{ url_for('passengers') }}">Back to Passengers</a>

{% endblock %}
